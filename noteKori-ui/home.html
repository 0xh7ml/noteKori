<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="./asset/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>Home - Expense NoteKori</title>
</head>

<body>

    <div class="upper-card">
        <!-- nav menu -->
        <div class="d-flex flex-row justify-content-between mb-5">
            <span class="nav-icon brand-text">Howdy, Saikat!</span>
            <span class="nav-icon bi bi-list"></span>
        </div>
        <!-- nav menu ends here  -->
        <!--  show current balance -->
        <div class="d-flex flex-column justify-content-center mt-1">
            <span class="dash-title">Current Balance</span>
            <div id="curren-amount"><i class="bi bi-currency-dollar"></i>200.20</div>
        </div>
        <!--  show current report -->
        <div class="dash-report d-flex flex-row justify-content-around">
            <div class="income">
                <label for="income-amount">Deposit Amount</label>
                <div class="income-amount">
                    <i class="bi bi-arrow-down-circle"></i> $25000
                </div>
            </div>
            <div class="report-expense">
                <label for="report-expense">Today's expenses</label>
                <div class="expense-amount">
                    <i class="bi bi-arrow-up-circle"></i> $20000
                </div>
            </div>
        </div>
        <div class="dash-report d-flex flex-row justify-content-around">
            <button type="submit" id="add-amount"><i class="bi bi-cash-coin"></i> Add Money</button>
            <button type="submit" id="add-expense"><i class="bi bi-currency-exchange"></i> Add Expense</button>
        </div>
    </div>

    <!-- Expense lvl -->
    <div class="container expense-label d-flex flex-row justify-content-between mt-4">
        <div class="expense-title text-light">Expenses</div>
        <div class="view-all-expense">
            <a href="expense-list.html" class="href">View all</a>
        </div>
    </div>
    <!-- show all expenses -->
    <div class="container d-flex flex-row justify-content-center mt-4">
        <div class="expense-wrap d-flex flex-column justify-content-between">
            <div class="horizontal-card mb-3">
                <div class="d-flex flex-row justify-content-between mb-2">
                    <div class="horizontal-expense">
                        <div class="horizontal-title">Breakfast</div>
                        <div class="horizontal-subtitle">05 Aug 2023</div>
                    </div>
                    <span class="horizontal-amount"><i class="bi bi-currency-dollar"></i>10</span>
                </div>
            </div>
            <div class="horizontal-card mb-3">
                <div class="d-flex flex-row justify-content-between mb-2">
                    <div class="horizontal-expense">
                        <div class="horizontal-title">Travel</div>
                        <div class="horizontal-subtitle">05 Aug 2023</div>
                    </div>
                    <span class="horizontal-amount"><i class="bi bi-currency-dollar"></i>20</span>
                </div>
            </div>
            <div class="horizontal-card mb-3">
                <div class="d-flex flex-row justify-content-between mb-2">
                    <div class="horizontal-expense">
                        <div class="horizontal-title">Lunch</div>
                        <div class="horizontal-subtitle">05 Aug 2023</div>
                    </div>
                    <span class="horizontal-amount"><i class="bi bi-currency-dollar"></i>50</span>
                </div>
            </div>
            <div class="horizontal-card mb-3">
                <div class="d-flex flex-row justify-content-between mb-2">
                    <div class="horizontal-expense">
                        <div class="horizontal-title">Snacks</div>
                        <div class="horizontal-subtitle">05 Aug 2023</div>
                    </div>
                    <span class="horizontal-amount"><i class="bi bi-currency-dollar"></i>100</span>
                </div>
            </div>
        </div>

    </div>
    <!-- bootstrap js -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
</body>

</html>
