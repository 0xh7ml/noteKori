name: Deploy API

on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy API Worker
    needs: ci
    runs-on: ubuntu-latest
    environment: production-api
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy the Worker
        working-directory: apps/api
        run: npx wrangler@4 deploy --env production

      - name: Sync AUTH_SECRET
        working-directory: apps/api
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          if [ -z "$AUTH_SECRET" ]; then
            echo "::error::AUTH_SECRET is not set in the production-api environment"
            exit 1
          fi
          printf '%s' "$AUTH_SECRET" | npx wrangler@4 secret put AUTH_SECRET --env production