<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <title>NoteKori - Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa; color: #18181b;
    }
    @media (prefers-color-scheme: dark) { body { background: #18181b; color: #fafafa; } }
    main { max-width: 22rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; opacity: .7; line-height: 1.5; }
    button {
      font: inherit; font-weight: 600; padding: .6rem 1.2rem; border-radius: .5rem; border: 0;
      background: #18181b; color: #fafafa; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { background: #fafafa; color: #18181b; } }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on your device yet. Open it once while online and it will be available offline. Anything you've already entered will sync when you reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
